# Puerto: 8081 para evitar choque con otros servicios en 8080 en tu maquina
server.port=8081

spring.application.name=tornotech-lms-backend

# PostgreSQL (usa variables de entorno en despliegue; los valores de la derecha son solo el default local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tornotech_lms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:clave}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# validate en desarrollo real una vez que Flyway maneje el schema; "update" solo para arrancar rapido
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (migraciones versionadas) - activar cuando se muevan los cambios de schema a db/migration
spring.flyway.enabled=false

# JWT (en despliegue, define JWT_SECRET como variable de entorno con un valor largo y aleatorio;
# el valor de la derecha es solo el default para desarrollo local)
lms.jwt.secret=${JWT_SECRET:cambiar-este-secreto-por-uno-largo-y-aleatorio-de-al-menos-32-caracteres}
lms.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS / frontend
lms.frontend.url=${FRONTEND_URL:http://localhost:5173}
